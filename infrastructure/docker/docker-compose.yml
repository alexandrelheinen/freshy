services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: freshy-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: freshy
      POSTGRES_PASSWORD: freshy_dev
      POSTGRES_DB: freshy
    volumes:
      - freshy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freshy -d freshy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freshy_pg_data:
