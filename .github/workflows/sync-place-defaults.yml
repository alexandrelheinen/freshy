name: Sync place defaults to R2

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/place-defaults/**'
      - 'packages/config/place-photos.ts'
      - 'scripts/upload-place-defaults.ts'
      - '.github/workflows/sync-place-defaults.yml'
  workflow_dispatch:

concurrency:
  group: sync-place-defaults
  cancel-in-progress: false

jobs:
  upload:
    name: Upload default place photos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Verify default place photo assets
        run: |
          test -d apps/web/public/place-defaults
          ls -la apps/web/public/place-defaults/
          test "$(find apps/web/public/place-defaults -maxdepth 1 -name 'default-*.png' | wc -l)" -eq 8
          pnpm generate:place-default-thumbs
          test "$(find apps/web/public/place-defaults/thumbs -maxdepth 1 -name 'default-*.webp' | wc -l)" -eq 8

      - name: Install AWS CLI for R2 upload
        run: pip install awscli --quiet

      - name: Sync to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -z "${R2_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::R2 secrets are not configured. Add R2_* secrets in repository settings to enable automatic upload."
            echo "Required secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME, R2_PUBLIC_URL"
            exit 0
          fi
          pnpm upload:place-defaults
