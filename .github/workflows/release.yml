name: Release | Mobile builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-release:
    name: Build and attach mobile install files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Mobile bundle smoke (EAS Android parity)
        run: pnpm smoke:mobile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android release APK
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_WEB_APP_URL: https://freshy-25e.pages.dev
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          FRESHY_RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          eas build --platform android --profile release --non-interactive --wait

      - name: Download Android APK
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          mkdir -p ../../dist/mobile
          TAG="${{ github.event.release.tag_name || github.sha }}"
          BUILD_ID="$(eas build:list --platform android --status finished --build-profile release --limit 1 --json --non-interactive 2>&1 | node -e "const raw=require('fs').readFileSync(0,'utf8'); const s=raw.search(/[\[{]/); if(s===-1)process.exit(1); const d=JSON.parse(raw.slice(s)); if(!d[0]?.id)process.exit(1); process.stdout.write(d[0].id)")"
          ARTIFACT_URL="$(eas build:view "${BUILD_ID}" --json 2>&1 | node -e "const raw=require('fs').readFileSync(0,'utf8'); const s=raw.search(/[\[{]/); if(s===-1)process.exit(1); const d=JSON.parse(raw.slice(s)); const url=d.artifacts?.buildUrl ?? d.artifacts?.applicationArchiveUrl; if(!url)process.exit(1); process.stdout.write(url)")"
          curl -fsSL "${ARTIFACT_URL}" -o "../../dist/mobile/freshy-${TAG}-android.apk"

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ### Mobile install file
            - `freshy-*-android.apk`: sideload on Android (enable unknown sources if needed)
          files: |
            dist/mobile/*.apk

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: freshy-mobile-${{ github.sha }}
          path: dist/mobile/*
