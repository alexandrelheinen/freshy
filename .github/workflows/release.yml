name: Release | Mobile builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-release:
    name: Build and attach mobile install files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android and iOS release binaries
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_WEB_APP_URL: https://freshy-25e.pages.dev
        run: |
          eas build --platform android --profile release --non-interactive --wait
          eas build --platform ios --profile release --non-interactive --wait

      - name: Download install artifacts
        working-directory: apps/mobile
        run: |
          mkdir -p ../../dist/mobile
          TAG="${{ github.event.release.tag_name || github.sha }}"
          eas build:download --platform android --latest --output "../../dist/mobile/freshy-${TAG}-android.apk"
          eas build:download --platform ios --latest --output "../../dist/mobile/freshy-${TAG}-ios.ipa"

      - name: Attach APK and IPA to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            ### Mobile install files
            - `freshy-*-android.apk`: sideload on Android (enable unknown sources if needed)
            - `freshy-*-ios.ipa`: install on registered iOS test devices (ad hoc). Register devices with `eas device:create`.
          files: |
            dist/mobile/*.apk
            dist/mobile/*.ipa

      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: freshy-mobile-${{ github.sha }}
          path: dist/mobile/*
