<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple interaction: clicking a chip toggles its style
            const chips = document.querySelectorAll('button.flex-shrink-0');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-white');
                        c.classList.add('glass', 'text-secondary');
                    });
                    chip.classList.remove('glass', 'text-secondary');
                    chip.classList.add('bg-primary', 'text-white');
                });
            });

            // Float effect for markers
            const pins = document.querySelectorAll('.pointer-events-auto');
            pins.forEach((pin, index) => {
                pin.style.animation = `float 3s ease-in-out ${index * 0.5}s infinite`;
            });
        });

        // Dynamic float animation inject
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
