<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #0c6780;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(12, 103, 128, 0.2);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed": "#002020",
                      "secondary-fixed": "#d2e6f0",
                      "primary-fixed": "#baeaff",
                      "on-error-container": "#93000a",
                      "tertiary": "#446464",
                      "on-surface": "#191c1e",
                      "on-tertiary-container": "#375757",
                      "on-tertiary-fixed-variant": "#2c4c4c",
                      "on-secondary": "#ffffff",
                      "surface-tint": "#0c6780",
                      "surface-container-high": "#e6e8ea",
                      "surface-container-lowest": "#ffffff",
                      "primary-container": "#87ceeb",
                      "on-primary": "#ffffff",
                      "inverse-primary": "#89d0ed",
                      "on-secondary-fixed-variant": "#374952",
                      "inverse-surface": "#2d3133",
                      "on-primary-fixed-variant": "#004d62",
                      "inverse-on-surface": "#eff1f3",
                      "surface": "#f7f9fb",
                      "secondary-container": "#cfe3ee",
                      "tertiary-fixed-dim": "#abcdcd",
                      "on-secondary-fixed": "#0b1e26",
                      "on-primary-fixed": "#001f29",
                      "on-primary-container": "#005870",
                      "surface-container-highest": "#e0e3e5",
                      "secondary-fixed-dim": "#b6c9d4",
                      "on-error": "#ffffff",
                      "secondary": "#4f616a",
                      "tertiary-container": "#a9cbcb",
                      "outline": "#6f787d",
                      "surface-container": "#eceef0",
                      "surface-bright": "#f7f9fb",
                      "on-tertiary": "#ffffff",
                      "primary-fixed-dim": "#89d0ed",
                      "on-secondary-container": "#53656f",
                      "surface-variant": "#e0e3e5",
                      "surface-container-low": "#f2f4f6",
                      "error": "#ba1a1a",
                      "background": "#f7f9fb",
                      "tertiary-fixed": "#c6e9e9",
                      "error-container": "#ffdad6",
                      "primary": "#0c6780",
                      "surface-dim": "#d8dadc",
                      "outline-variant": "#bfc8cd",
                      "on-surface-variant": "#3f484c",
                      "on-background": "#191c1e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "20px",
                      "lg": "24px",
                      "gutter-mobile": "12px",
                      "xl": "32px",
                      "base": "4px",
                      "xs": "8px",
                      "sm": "12px",
                      "md": "16px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "title-md": ["Inter"],
                      "label-caps": ["Inter"],
                      "body-sm": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-40">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/80 backdrop-blur-md shadow-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-primary/10 transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Adicionar Local</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="mt-16 px-margin-mobile space-y-lg pt-lg">
<!-- Photo Upload Area -->
<section>
<div class="relative w-full aspect-video rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center overflow-hidden group cursor-pointer active:scale-[0.98] transition-all">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/20 z-0"></div>
<div class="z-10 flex flex-col items-center text-on-surface-variant">
<span class="material-symbols-outlined text-4xl mb-xs">add_a_photo</span>
<p class="font-body-sm text-body-sm font-semibold">Adicionar Fotos do Local</p>
<p class="text-[10px] uppercase tracking-wider opacity-60">PNG, JPG até 10MB</p>
</div>
<!-- Placeholder for actual image if one were uploaded -->
<div class="hidden absolute inset-0 bg-cover bg-center" data-alt="A brightly lit, airy interior of a modern minimalist cafe. The space features white walls, light wood furniture, and large windows that invite plenty of natural light. The atmosphere is refreshing and cool, characterized by a clean, glassmorphic aesthetic with subtle blue accents, creating an inviting space for visitors to escape the heat." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA29k6tfRH_lHoiUIUeyJlSPCylDZEvRxywBR4-7f7VreZPI05_V5n5FJxOYpc-nXY_NpvhlgrKb31OnPisYDL_SGL6hxaKsilkHXlSWDlH469d7ZRoFWAnoEwFNdNCVhqASuI2ZJX6EWgA1Ap1WPA4gNh5h0y3yuQy5mhbl10_LdRWUbJ7_zCT7K3wL2ClRwfbMFqY-cxMpHaM-G9UBHFJcsk8YJr90Cjp3RH9lsxAQi0R6krIospm6-31nm6Nh_k0xv2_GgKBAiWl')"></div>
</div>
</section>
<!-- Basic Info Form -->
<section class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Nome do Estabelecimento</label>
<input class="w-full h-12 px-md rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-lg text-body-lg" placeholder="Ex: Café Glacial Central" type="text"/>
</div>
<div class="grid grid-cols-1 gap-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Categoria</label>
<div class="relative">
<select class="w-full h-12 pl-md pr-10 rounded-lg border border-outline-variant bg-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-lg text-body-lg">
<option>Café</option>
<option>Restaurante</option>
<option>Biblioteca</option>
<option>Livraria</option>
<option>Coworking</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">Localização</label>
<div class="flex gap-xs">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant">location_on</span>
<input class="w-full h-12 pl-10 pr-md rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-sm text-body-sm" placeholder="Endereço completo" type="text"/>
</div>
<button class="h-12 px-md bg-secondary-container text-on-secondary-container rounded-lg flex items-center gap-xs font-label-caps text-label-caps hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined">map</span>
                        MAPA
                    </button>
</div>
</div>
</section>
<!-- Cooling Stats (Brand Specific) -->
<section class="bg-primary-container/10 p-md rounded-xl border border-primary-container/30 space-y-lg">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary">ac_unit</span>
<h3 class="font-title-md text-title-md text-primary">Status de Resfriamento</h3>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant">Temperatura Alvo</label>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary" id="temp-val">22°C</span>
</div>
<input class="w-full h-2 bg-outline-variant rounded-full appearance-none custom-slider" id="temp-slider" max="26" min="16" oninput="document.getElementById('temp-val').innerText = this.value + '°C'" type="range" value="22"/>
<div class="flex justify-between text-[10px] text-outline font-bold">
<span>16°C</span>
<span>26°C</span>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant">Intensidade do Ar Condicionado</label>
<div class="flex justify-between items-center gap-xs">
<div class="flex flex-1 justify-between bg-surface/50 p-sm rounded-lg">
<button class="snowflake-btn text-primary-fixed-dim transition-all" data-val="1" onclick="setStrength(1)"><span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">ac_unit</span></button>
<button class="snowflake-btn text-primary-fixed-dim transition-all" data-val="2" onclick="setStrength(2)"><span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">ac_unit</span></button>
<button class="snowflake-btn text-primary-fixed-dim transition-all" data-val="3" onclick="setStrength(3)"><span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">ac_unit</span></button>
<button class="snowflake-btn text-outline-variant transition-all" data-val="4" onclick="setStrength(4)"><span class="material-symbols-outlined text-3xl">ac_unit</span></button>
<button class="snowflake-btn text-outline-variant transition-all" data-val="5" onclick="setStrength(5)"><span class="material-symbols-outlined text-3xl">ac_unit</span></button>
</div>
</div>
<p class="text-center font-body-sm text-body-sm text-on-primary-container opacity-80" id="strength-label">Confortável</p>
</div>
</section>
<!-- Amenities Multi-select -->
<section class="space-y-md">
<label class="block font-label-caps text-label-caps text-on-surface-variant">Comodidades</label>
<div class="flex flex-wrap gap-xs">
<button class="px-md py-xs rounded-full border border-outline-variant text-on-surface-variant font-body-sm text-body-sm flex items-center gap-xs transition-all active:scale-95 bg-surface" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-lg">wifi</span>
                    Free Wi-Fi
                </button>
<button class="px-md py-xs rounded-full border border-outline-variant text-on-surface-variant font-body-sm text-body-sm flex items-center gap-xs transition-all active:scale-95 bg-surface" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-lg">quiet_time</span>
                    Quiet Zone
                </button>
<button class="px-md py-xs rounded-full border border-outline-variant text-on-surface-variant font-body-sm text-body-sm flex items-center gap-xs transition-all active:scale-95 bg-surface" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-lg">electrical_services</span>
                    Power Outlets
                </button>
<button class="px-md py-xs rounded-full border border-outline-variant text-on-surface-variant font-body-sm text-body-sm flex items-center gap-xs transition-all active:scale-95 bg-surface" onclick="toggleChip(this)">
<span class="material-symbols-outlined text-lg">chair</span>
                    Comfy Seating
                </button>
</div>
</section>
</main>
<!-- Bottom Actions Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-lg border-t border-outline-variant/20 px-margin-mobile pt-md pb-8 space-y-sm">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-lg-mobile text-headline-lg-mobile shadow-lg shadow-primary/20 active:scale-95 transition-all">
            Criar e Publicar
        </button>
<button class="w-full h-12 bg-transparent text-secondary font-title-md text-title-md hover:bg-secondary/5 rounded-xl transition-all">
            Salvar como Rascunho
        </button>
</footer>
<script>
        function setStrength(val) {
            const btns = document.querySelectorAll('.snowflake-btn');
            const label = document.getElementById('strength-label');
            const strengths = ["Muito Leve", "Leve", "Confortável", "Frio", "Gélido"];
            
            label.innerText = strengths[val-1];
            
            btns.forEach(btn => {
                const btnVal = parseInt(btn.getAttribute('data-val'));
                const icon = btn.querySelector('.material-symbols-outlined');
                if (btnVal <= val) {
                    btn.classList.replace('text-outline-variant', 'text-primary');
                    icon.style.fontVariationSettings = "'FILL' 1";
                } else {
                    btn.classList.replace('text-primary', 'text-outline-variant');
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });
        }

        function toggleChip(el) {
            if (el.classList.contains('bg-primary-container')) {
                el.classList.remove('bg-primary-container', 'border-primary', 'text-on-primary-container');
                el.classList.add('bg-surface', 'border-outline-variant', 'text-on-surface-variant');
            } else {
                el.classList.add('bg-primary-container', 'border-primary', 'text-on-primary-container');
                el.classList.remove('bg-surface', 'border-outline-variant', 'text-on-surface-variant');
            }
        }
    </script>
</body></html>
