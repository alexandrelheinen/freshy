<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.overflow-x-auto button');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    chips.forEach(c => {
                        c.classList.remove('bg-primary', 'text-white', 'border-primary', 'shadow-bubbly');
                        c.classList.add('glass', 'text-primary', 'border-white', 'shadow-md');
                    });
                    chip.classList.remove('glass', 'text-primary', 'border-white', 'shadow-md');
                    chip.classList.add('bg-primary', 'text-white', 'border-primary', 'shadow-bubbly');
                });
            });

            const pins = document.querySelectorAll('.pointer-events-auto');
            pins.forEach((pin, index) => {
                pin.style.animation = `float 3s ease-in-out ${index * 0.5}s infinite`;
            });
        });

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-12px); }
            }
        `;
        document.head.appendChild(style);
    </script>
