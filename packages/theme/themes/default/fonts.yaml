# UI body font (Freshy Arctic: Quicksand throughout the interface).
sans:
  family: Quicksand
  fallbacks:
    - system-ui
    - sans-serif
  weights:
    - 400
    - 500
    - 600
    - 700

# Brand wordmark font. Lilita One is a single-weight Google Font (400 only).
logo:
  family: Lilita One
  fallbacks:
    - system-ui
    - sans-serif
  weights:
    - 400
  letterSpacing: '0.00em'
  baselineOffset: '-0.02em'
